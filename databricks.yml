# This is a Declarative Automation Bundle definition for dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab
  uuid: a93149ee-6098-4362-a851-f3c34dd0fe89

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Applied to every target. Tags make this bundle's jobs and pipelines easy to filter in the UI.
presets:
  tags:
    project: dab

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
    variables:
      catalog: dab_dev
      schema: dab
  prod:
    mode: production
    workspace:
      host: https://dbc-b5c9918e-c2d2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/keqingli1129@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/keqingli1129@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_prod
      schema: prod
    permissions:
      - user_name: keqingli1129@gmail.com
        level: CAN_MANAGE

  # Azure workspace targets; deploy with --target azure-dev / azure-prod.
  azure-dev:
    mode: development
    workspace:
      host: https://adb-7405618954475016.16.azuredatabricks.net
      profile: azure
    variables:
      catalog: dab_dev
      schema: dab
  azure-prod:
    mode: production
    # Keep job schedules paused until we're ready to run in prod; remove to enable them.
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://adb-7405618954475016.16.azuredatabricks.net
      profile: azure
      root_path: /Workspace/Users/keqingli1129@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_prod
      schema: prod
    permissions:
      - user_name: keqingli1129@gmail.com
        level: CAN_MANAGE
